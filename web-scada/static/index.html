<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorting Line 01 â€” Web-SCADA / HMI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --yellow: #eab308;
      --blue: #38bdf8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.5rem; letter-spacing: 0.03em; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn-grafana {
      background: var(--card);
      color: var(--blue);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-grafana:hover {
      background: #273549;
      border-color: var(--blue);
    }
    .badge {
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      background: #475569;
    }
    .badge.run { background: #15803d; }
    .badge.fault { background: #b91c1c; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.65; } }

    .controls {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .control-group { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.25rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.08); }
    .btn-start { background: #4ade80; color: #052e16; }
    .btn-stop { background: #facc15; color: #422006; }
    .btn-reset { background: #7dd3fc; color: #082f49; }
    .btn-fault { background: #f87171; color: #450a0a; }
    .btn-ack { background: #3b82f6; color: #fff; padding: 0.4rem 0.85rem; font-size: 0.8rem; }

    #feedback {
      min-height: 1.4rem;
      color: var(--blue);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .card-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-value { font-size: 2.2rem; font-weight: 700; margin-top: 0.4rem; }

    h2 { font-size: 1.15rem; margin-bottom: 0.75rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      text-align: left;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; background: #162032; }
    .status-active { color: #f87171; font-weight: 700; }
    .status-ack { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SORTING LINE 01 â€” OPERATOR SCADA / HMI</h1>
      <div class="subtitle">Bidirectional OPC UA Control &amp; Alarm Management</div>
    </div>
    <div class="header-actions">
      <a href="http://localhost:3000/d/sorting-line-oee" target="_blank" rel="noopener noreferrer" class="btn-grafana">&#128202; Grafana Analytics &#8599;</a>
      <div id="state-badge" class="badge">IDLE (0)</div>
    </div>
  </header>

  <div class="controls">
    <div class="control-group">
      <button class="btn-start" onclick="sendCmd('START')">&#9654; START LINE</button>
      <button class="btn-stop" onclick="sendCmd('STOP')">&#9632; STOP LINE</button>
      <button class="btn-reset" onclick="sendCmd('RESET')">&#8635; RESET FAULT</button>
    </div>
    <button class="btn-fault" onclick="sendCmd('FAULT_TEST')">&#9888; SIMULATE FAULT</button>
  </div>

  <div id="feedback"></div>

  <section class="kpis">
    <div class="card">
      <div class="card-label">Total Inspected</div>
      <div class="card-value" id="kpi-total">0</div>
    </div>
    <div class="card">
      <div class="card-label">Branch A</div>
      <div class="card-value" id="kpi-a">0</div>
    </div>
    <div class="card">
      <div class="card-label">Branch B</div>
      <div class="card-value" id="kpi-b">0</div>
    </div>
    <div class="card">
      <div class="card-label">OEE Availability</div>
      <div class="card-value" id="kpi-oee">0.0%</div>
    </div>
  </section>

  <section>
    <h2>Active &amp; Historical Alarms</h2>
    <table>
      <thead>
        <tr>
          <th>Time (UTC)</th>
          <th>Code</th>
          <th>Description</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="alarms-body"></tbody>
    </table>
  </section>

  <script>
    async function sendCmd(command) {
      const fb = document.getElementById("feedback");
      try {
        const res = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Command failed");
        fb.textContent = `Command ${data.command} executed (${data.tag})`;
        await refreshStatus();
      } catch (err) {
        fb.textContent = `Error: ${err.message}`;
      }
    }

    async function ackAlarm(id) {
      await fetch(`/api/alarms/${id}/ack`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ operator: "Shift_Lead_1" })
      });
      await refreshStatus();
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        const badge = document.getElementById("state-badge");
        badge.textContent = `${data.state_label} (${data.state})`;
        badge.className = "badge" + (data.state === 10 ? " run" : data.state === 99 ? " fault" : "");

        document.getElementById("kpi-total").textContent = data.total_count ?? 0;
        document.getElementById("kpi-a").textContent = data.sorted_a ?? 0;
        document.getElementById("kpi-b").textContent = data.sorted_b ?? 0;
        document.getElementById("kpi-oee").textContent = `${Number(data.oee_availability ?? 0).toFixed(1)}%`;

        const tbody = document.getElementById("alarms-body");
        tbody.innerHTML = (data.alarms || []).map(a => {
          const t = new Date(a.created_at).toLocaleTimeString("en-US", { timeZone: "UTC" });
          const statusHtml = a.active
            ? `<span class="status-active">ACTIVE (UNACK)</span>`
            : `<span class="status-ack">Ack by ${a.acknowledged_by || "Operator"}</span>`;
          const actionHtml = a.active
            ? `<button class="btn-ack" onclick="ackAlarm(${a.id})">Acknowledge</button>`
            : `â€”`;
          return `<tr>
            <td>${t}</td>
            <td><strong>${a.alarm_code}</strong></td>
            <td>${a.message}</td>
            <td>${statusHtml}</td>
            <td>${actionHtml}</td>
          </tr>`;
        }).join("");
      } catch (e) {
        console.error(e);
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 1000);
  </script>
</body>
</html>
